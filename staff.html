<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>鍛治町酒場 神田店 - マイスケジュール</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👤</text></svg>">
    <style>
        html, body { min-height: 100vh; }
        body.staff-body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .staff-app {
            width: 100%;
            max-width: 460px;
            min-height: 100vh;
            background: white;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 640px) {
            .staff-app {
                margin: 16px auto;
                min-height: calc(100vh - 32px);
                border-radius: var(--border-radius-lg);
                box-shadow: var(--shadow-lg);
                overflow: hidden;
            }
        }

        /* ---------- LOGIN ---------- */
        .staff-login-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 28px 24px;
        }
        .staff-login-logo { text-align: center; margin-bottom: 22px; }
        .staff-login-logo .badge-icon {
            width: 56px; height: 56px;
            margin: 0 auto 12px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-md);
        }
        .staff-login-logo .badge-icon i { font-size: 1.5rem; color: white; }
        .staff-login-logo h1 { font-size: 1.05rem; color: var(--dark); font-weight: 700; line-height: 1.4; }
        .staff-login-logo .sub { font-size: 12.5px; color: var(--gray-500); font-weight: 500; margin-top: 2px; }

        .staff-login-error {
            background: var(--danger-light);
            color: var(--danger);
            border-radius: var(--border-radius-sm);
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 14px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        /* Input với icon nhúng bên trái, gọn hơn ô input mặc định của app */
        .staff-field { margin-bottom: 14px; }
        .staff-field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--gray-500);
            margin-bottom: 6px;
        }
        .staff-input-wrap { position: relative; }
        .staff-input-wrap i.field-icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 14px;
            pointer-events: none;
        }
        .staff-input-wrap input {
            width: 100%;
            padding: 13px 14px 13px 40px;
            border: 1.5px solid var(--border);
            border-radius: var(--border-radius-sm);
            font-size: 15px;
            font-family: inherit;
            background: var(--gray-50);
            transition: all var(--transition-fast);
        }
        .staff-input-wrap input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }
        .staff-input-wrap input#loginId { text-transform: uppercase; letter-spacing: 0.5px; }
        .staff-toggle-pass {
            position: absolute;
            right: 6px; top: 50%;
            transform: translateY(-50%);
            width: 32px; height: 32px;
            border: none;
            background: none;
            color: var(--gray-400);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        .staff-input-wrap:has(.staff-toggle-pass) input { padding-right: 40px; }

        .staff-login-btn {
            width: 100%;
            margin-top: 6px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .staff-login-btn:disabled { opacity: 0.7; cursor: default; }
        .staff-lang-switch {
            text-align: center; margin-top: 18px;
        }
        .staff-lang-switch button {
            background: var(--gray-50);
            border: 1px solid var(--border);
            color: var(--gray-500);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 20px;
        }
        .staff-login-hint {
            text-align: center;
            font-size: 11.5px;
            color: var(--gray-400);
            margin-top: 14px;
            line-height: 1.5;
        }

        /* ---------- MAIN ---------- */
        .staff-main { display: none; flex-direction: column; flex: 1; }
        .staff-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            flex-shrink: 0;
        }
        .staff-topbar-name { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
        .staff-topbar-position { font-size: 11.5px; opacity: 0.9; }
        .staff-topbar-actions { display: flex; gap: 8px; }
        .staff-icon-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 13px;
        }
        .staff-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .staff-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--gray-500);
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
        }
        .staff-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .staff-content { flex: 1; padding: 12px 12px 84px; overflow-y: auto; }
        .staff-week-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .staff-week-nav .week-label { font-weight: 700; color: var(--dark); font-size: 13px; }
        .staff-day-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border: 1px solid var(--border);
            border-radius: var(--border-radius-sm);
            margin-bottom: 6px;
        }
        .staff-day-row.today { border-color: var(--primary); background: var(--primary-light); }
        .staff-day-date { width: 42px; text-align: center; flex-shrink: 0; }
        .staff-day-date .dow { font-size: 10px; color: var(--gray-500); font-weight: 700; }
        .staff-day-date .num { font-size: 1rem; font-weight: 800; color: var(--dark); }
        .staff-day-info { flex: 1; min-width: 0; }
        .staff-day-status { font-weight: 700; font-size: 13px; }
        .staff-day-status.work { color: var(--success); }
        .staff-day-status.rest { color: var(--warning); }
        .staff-day-status.none { color: var(--gray-400); }
        .staff-day-sub { font-size: 11px; color: var(--gray-500); margin-top: 1px; }
        .staff-request-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--gray-600);
            cursor: pointer;
            flex-shrink: 0;
        }
        .staff-req-item {
            border: 1px solid var(--border);
            border-radius: var(--border-radius-sm);
            padding: 11px 12px;
            margin-bottom: 8px;
        }
        .staff-req-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .staff-req-date { font-weight: 700; color: var(--dark); font-size: 13px; }
        .staff-req-status {
            font-size: 10.5px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 20px;
        }
        .staff-req-status.pending { background: var(--warning-light); color: var(--warning); }
        .staff-req-status.approved { background: var(--success-light); color: var(--success); }
        .staff-req-status.rejected { background: var(--danger-light); color: var(--danger); }
        .staff-req-body { font-size: 12.5px; color: var(--gray-600); }
        .staff-empty { text-align: center; padding: 34px 20px; color: var(--gray-400); }
        .staff-empty i { font-size: 1.8rem; margin-bottom: 8px; display: block; }
        .staff-fab {
            position: absolute;
            right: 18px;
            bottom: 84px;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 19px;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
        }
    </style>
</head>
<body class="staff-body">

    <div class="staff-app" id="staffApp">

        <!-- LOGIN SCREEN -->
        <div class="staff-login-wrap" id="loginScreen">
            <div class="staff-login-logo">
                <div class="badge-icon"><i class="fas fa-calendar-user"></i></div>
                <h1>鍛治町酒場 神田店</h1>
                <div class="sub" data-lang="ja">マイスケジュール</div>
                <div class="sub" data-lang="zh">我的排班</div>
            </div>
            <div class="staff-login-error" id="loginError">
                <i class="fas fa-circle-exclamation"></i><span id="loginErrorText"></span>
            </div>
            <form id="loginForm" autocomplete="on">
                <div class="staff-field">
                    <label data-lang="ja">ログインID</label>
                    <label data-lang="zh">登录账号</label>
                    <div class="staff-input-wrap">
                        <i class="fas fa-user field-icon"></i>
                        <input type="text" id="loginId" placeholder="KAJICHO01" autocomplete="username" autocapitalize="characters" inputmode="text" spellcheck="false">
                    </div>
                </div>
                <div class="staff-field">
                    <label data-lang="ja">パスワード</label>
                    <label data-lang="zh">密码</label>
                    <div class="staff-input-wrap">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="loginPassword" placeholder="••••••" autocomplete="current-password">
                        <button type="button" class="staff-toggle-pass" id="togglePassBtn" onclick="toggleLoginPasswordVisibility()" tabindex="-1" aria-label="show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary staff-login-btn" id="loginBtn">
                    <i class="fas fa-right-to-bracket" id="loginBtnIcon"></i>
                    <span id="loginBtnText"><span data-lang="ja">ログイン</span><span data-lang="zh">登录</span></span>
                </button>
            </form>
            <div class="staff-lang-switch">
                <button type="button" onclick="toggleStaffLang()">
                    <i class="fas fa-globe" style="margin-right:4px;"></i>日本語 / 中文
                </button>
            </div>
            <div class="staff-login-hint">
                <span data-lang="ja">IDとパスワードは店長から発行されます。不明な場合は店長にお問い合わせください。</span>
                <span data-lang="zh">账号密码由店长发放，如有问题请联系店长。</span>
            </div>
        </div>

        <!-- MAIN SCREEN -->
        <div class="staff-main" id="mainScreen">
            <div class="staff-topbar">
                <div>
                    <div class="staff-topbar-name" id="topbarName">-</div>
                    <div class="staff-topbar-position" id="topbarPosition">-</div>
                </div>
                <div class="staff-topbar-actions">
                    <button type="button" class="staff-icon-btn" onclick="toggleStaffLang()" title="言語">
                        <i class="fas fa-globe"></i>
                    </button>
                    <button type="button" class="staff-icon-btn" onclick="doLogout()" title="Logout">
                        <i class="fas fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>

            <div class="staff-tabs">
                <button type="button" class="staff-tab active" data-tab="schedule" onclick="switchStaffTab('schedule')">
                    <i class="fas fa-calendar-week"></i> <span data-lang="ja">シフト</span><span data-lang="zh">排班</span>
                </button>
                <button type="button" class="staff-tab" data-tab="requests" onclick="switchStaffTab('requests')">
                    <i class="fas fa-paper-plane"></i> <span data-lang="ja">リクエスト</span><span data-lang="zh">申请</span>
                </button>
            </div>

            <!-- Schedule tab -->
            <div class="staff-content" id="tabSchedule">
                <div class="staff-week-nav">
                    <button type="button" class="staff-icon-btn" style="background:var(--gray-100); color:var(--dark);" onclick="changeStaffWeek(-1)">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <div class="week-label" id="weekLabel">-</div>
                    <button type="button" class="staff-icon-btn" style="background:var(--gray-100); color:var(--dark);" onclick="changeStaffWeek(1)">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div id="scheduleList"></div>
            </div>

            <!-- Requests tab -->
            <div class="staff-content" id="tabRequests" style="display:none;">
                <div id="requestsList"></div>
            </div>

            <button type="button" class="staff-fab" onclick="openRequestForm()" title="Request">
                <i class="fas fa-plus"></i>
            </button>
        </div>
    </div>

    <!-- Request Form Modal (chỉ còn 1 tính năng duy nhất: gửi lưu ý/tin nhắn cho bên quản lý) -->
    <div class="modal" id="requestModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-comment-dots"></i> <span data-lang="ja">本社への連絡</span><span data-lang="zh">给店长留言</span></h3>
                <button type="button" class="modal-close" onclick="closeStaffModal('requestModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label data-lang="ja">関連する日付</label>
                    <label data-lang="zh">相关日期</label>
                    <input type="date" id="reqDate" class="input-field">
                </div>
                <div class="form-group">
                    <label data-lang="ja">内容</label>
                    <label data-lang="zh">内容</label>
                    <textarea id="reqNote" class="input-field" rows="4" placeholder="..."></textarea>
                </div>
                <button type="button" class="btn-primary" style="width:100%;" onclick="submitStaffRequest()">
                    <i class="fas fa-paper-plane"></i>
                    <span data-lang="ja">送信</span><span data-lang="zh">提交</span>
                </button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>

            apiKey: "AIzaSyB6C3s4EAPEx0GBLnBXAz4aYJfoCBEyofc",

        };
        firebase.initializeApp(firebaseConfig);
        window.database = firebase.database();
        window.auth = firebase.auth();
    </script>
    <script src="staff.js"></script>
</body>
</html>
