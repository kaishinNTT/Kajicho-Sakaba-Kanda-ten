<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>鍛治町酒場 神田店 - マイスケジュール</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👤</text></svg>">
    <style>
        html, body { min-height: 100vh; }
        body.staff-body {
            background: linear-gradient(160deg, #eef2ff 0%, #e0f2fe 45%, #f0fdfa 100%);
        }
        .staff-app {
            width: 100%;
            max-width: 460px;
            min-height: 100vh;
            background: white;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 640px) {
            .staff-app {
                margin: 16px auto;
                min-height: calc(100vh - 32px);
                border-radius: var(--border-radius-lg);
                box-shadow: var(--shadow-lg);
                overflow: hidden;
            }
        }

        /* ---------- LOGIN ---------- */
        .staff-login-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 36px 26px;
        }
        .staff-login-logo { text-align: center; margin-bottom: 28px; }
        .staff-login-logo .badge-icon {
            width: 60px; height: 60px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-md);
        }
        .staff-login-logo .badge-icon i { font-size: 1.5rem; color: white; }
        .staff-login-logo h1 { font-size: 1.05rem; color: var(--dark); font-weight: 800; line-height: 1.5; }
        .staff-login-logo .sub { font-size: 13px; color: var(--gray-500); font-weight: 600; margin-top: 4px; }

        .staff-login-error {
            background: var(--danger-light);
            color: var(--danger);
            border-radius: var(--border-radius-sm);
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 16px;
            display: none;
            align-items: flex-start;
            gap: 8px;
        }
        .staff-login-error i { margin-top: 1px; flex-shrink: 0; }

        /* Input với icon nhúng bên trái, gọn hơn ô input mặc định của app */
        .staff-field { margin-bottom: 16px; }
        .staff-field label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--gray-600);
            margin-bottom: 7px;
        }
        .staff-input-wrap { position: relative; }
        .staff-input-wrap i.field-icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 14px;
            pointer-events: none;
        }
        .staff-input-wrap input {
            width: 100%;
            padding: 14px 14px 14px 42px;
            border: 1.5px solid var(--border);
            border-radius: var(--border-radius-sm);
            font-size: 15px;
            line-height: 1.4;
            font-family: inherit;
            background: var(--gray-50);
            transition: all var(--transition-fast);
        }
        .staff-input-wrap input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }
        .staff-input-wrap input#loginId { text-transform: uppercase; letter-spacing: 0.5px; }
        /* Ô mật khẩu có thêm nút hiện/ẩn bên phải -> luôn chừa sẵn padding-right cố định
           (không dùng :has() vì 1 số webview trong app chat - Zalo/Messenger/FB - dùng
           engine cũ chưa hỗ trợ :has(), khiến chữ bị nút hiện/ẩn đè lên) */
        .staff-input-wrap input#loginPassword,
        .staff-input-wrap input#currentPassword,
        .staff-input-wrap input#newPassword,
        .staff-input-wrap input#confirmNewPassword {
            padding-right: 44px;
        }
        .staff-toggle-pass {
            position: absolute;
            right: 4px; top: 50%;
            transform: translateY(-50%);
            width: 36px; height: 36px;
            border: none;
            background: none;
            color: var(--gray-400);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }

        .staff-login-btn {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            font-size: 15px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .staff-login-btn:disabled { opacity: 0.7; cursor: default; }
        .staff-lang-switch {
            text-align: center; margin-top: 20px;
        }
        .staff-lang-switch button {
            background: var(--gray-50);
            border: 1px solid var(--border);
            color: var(--gray-600);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            padding: 7px 16px;
            border-radius: 20px;
        }
        .staff-login-hint {
            text-align: center;
            font-size: 12px;
            color: var(--gray-400);
            margin-top: 18px;
            line-height: 1.6;
            padding: 0 8px;
        }

        /* ---------- MAIN ---------- */
        .staff-main { display: none; flex-direction: column; flex: 1; }
        .staff-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            flex-shrink: 0;
        }
        .staff-topbar-name { font-weight: 700; font-size: 0.98rem; line-height: 1.4; }
        .staff-topbar-position { font-size: 12px; opacity: 0.92; margin-top: 1px; }
        .staff-topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .staff-icon-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 13px;
        }

        /* Chuyển đổi Tuần / Tháng */
        .staff-view-switch {
            display: flex;
            gap: 6px;
            padding: 12px 14px 0;
            flex-shrink: 0;
        }
        .staff-view-btn {
            flex: 1;
            padding: 9px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-500);
            background: var(--gray-100);
            border: none;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
        }
        .staff-view-btn.active {
            color: white;
            background: var(--primary);
        }

        .staff-content { flex: 1; padding: 14px; overflow-y: auto; }

        .staff-period-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .staff-period-nav .period-label { font-weight: 800; color: var(--dark); font-size: 14.5px; }
        .staff-period-nav .staff-icon-btn { background: var(--gray-100); color: var(--dark); }

        /* Week list */
        .staff-day-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--border-radius-sm);
            margin-bottom: 8px;
            border-left-width: 4px;
        }
        .staff-day-row.today { border-color: var(--primary); background: var(--primary-light); border-left-color: var(--primary); }
        .staff-day-row.shift-early { border-left-color: var(--early-shift); }
        .staff-day-row.shift-late { border-left-color: var(--late-shift); }
        .staff-day-row.shift-rest { border-left-color: var(--warning); }
        .staff-day-row.shift-none { border-left-color: var(--border); }
        .staff-day-date { width: 44px; text-align: center; flex-shrink: 0; }
        .staff-day-date .dow { font-size: 10.5px; color: var(--gray-500); font-weight: 700; }
        .staff-day-date .num { font-size: 1.05rem; font-weight: 800; color: var(--dark); }
        .staff-day-info { flex: 1; min-width: 0; }
        .staff-day-status { font-weight: 800; font-size: 14px; display:flex; align-items:center; gap:6px; }
        .staff-day-status.shift-early { color: var(--early-shift); }
        .staff-day-status.shift-late { color: var(--late-shift); }
        .staff-day-status.shift-rest { color: var(--warning); }
        .staff-day-status.shift-none { color: var(--gray-400); }
        .staff-day-sub { font-size: 11.5px; color: var(--gray-500); margin-top: 2px; }

        /* Month calendar grid */
        .staff-month-dow-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 6px;
        }
        .staff-month-dow-row div {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--gray-400);
            padding-bottom: 4px;
        }
        .staff-month-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .staff-month-cell {
            aspect-ratio: 1 / 1.05;
            border-radius: 8px;
            padding: 4px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-size: 10px;
            background: var(--gray-50);
            border: 1px solid transparent;
        }
        .staff-month-cell.empty { background: none; }
        .staff-month-cell.today { border-color: var(--primary); }
        .staff-month-cell .cell-num { font-weight: 800; font-size: 12px; color: var(--dark); margin-bottom: 2px; }
        .staff-month-cell.shift-early { background: var(--early-shift-light); }
        .staff-month-cell.shift-early .cell-num { color: var(--early-shift); }
        .staff-month-cell.shift-late { background: var(--late-shift-light); }
        .staff-month-cell.shift-late .cell-num { color: var(--late-shift); }
        .staff-month-cell.shift-rest { background: var(--warning-light); }
        .staff-month-cell.shift-rest .cell-num { color: var(--warning); }
        .staff-month-cell .cell-time { font-size: 9px; color: var(--gray-600); font-weight: 600; line-height: 1.2; text-align: center; }

        .staff-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
        .staff-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--gray-500); }
        .staff-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

        .staff-empty { text-align: center; padding: 40px 20px; color: var(--gray-400); }
        .staff-empty i { font-size: 1.8rem; margin-bottom: 8px; display: block; }

        /* Modal đổi mật khẩu - dùng lại .modal/.modal-content của style.css */
        .staff-pw-hint { font-size: 11.5px; color: var(--gray-400); margin: -6px 0 14px; line-height: 1.6; }
    </style>
</head>
<body class="staff-body">

    <div class="staff-app" id="staffApp">

        <!-- LOGIN SCREEN -->
        <div class="staff-login-wrap" id="loginScreen">
            <div class="staff-login-logo">
                <div class="badge-icon"><i class="fas fa-calendar-check"></i></div>
                <h1>鍛治町酒場 神田店</h1>
                <div class="sub" data-lang="ja">マイスケジュール</div>
                <div class="sub" data-lang="zh">我的排班</div>
            </div>
            <div class="staff-login-error" id="loginError">
                <i class="fas fa-circle-exclamation"></i><span id="loginErrorText"></span>
            </div>
            <form id="loginForm" autocomplete="on">
                <div class="staff-field">
                    <label data-lang="ja">ログインID</label>
                    <label data-lang="zh">登录账号</label>
                    <div class="staff-input-wrap">
                        <i class="fas fa-user field-icon"></i>
                        <input type="text" id="loginId" placeholder="KAJICHO01" autocomplete="username" autocapitalize="characters" inputmode="text" spellcheck="false">
                    </div>
                </div>
                <div class="staff-field">
                    <label data-lang="ja">パスワード</label>
                    <label data-lang="zh">密码</label>
                    <div class="staff-input-wrap">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="loginPassword" placeholder="••••••" autocomplete="current-password">
                        <button type="button" class="staff-toggle-pass" id="togglePassBtn" onclick="togglePasswordVisibility('loginPassword', 'togglePassBtn')" tabindex="-1" aria-label="show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary staff-login-btn" id="loginBtn">
                    <i class="fas fa-right-to-bracket" id="loginBtnIcon"></i>
                    <span id="loginBtnText"><span data-lang="ja">ログイン</span><span data-lang="zh">登录</span></span>
                </button>
            </form>
            <div class="staff-lang-switch">
                <button type="button" onclick="toggleStaffLang()">
                    <i class="fas fa-globe" style="margin-right:4px;"></i>日本語 / 中文
                </button>
            </div>
            <div class="staff-login-hint">
                <span data-lang="ja">IDとパスワードは店長から発行されます。不明な場合は店長にお問い合わせください。</span>
                <span data-lang="zh">账号密码由店长发放，如有问题请联系店长。</span>
            </div>
        </div>

        <!-- MAIN SCREEN -->
        <div class="staff-main" id="mainScreen">
            <div class="staff-topbar">
                <div>
                    <div class="staff-topbar-name" id="topbarName">-</div>
                    <div class="staff-topbar-position" id="topbarPosition">-</div>
                </div>
                <div class="staff-topbar-actions">
                    <button type="button" class="staff-icon-btn" onclick="openChangePasswordModal()" title="Password">
                        <i class="fas fa-key"></i>
                    </button>
                    <button type="button" class="staff-icon-btn" onclick="toggleStaffLang()" title="言語">
                        <i class="fas fa-globe"></i>
                    </button>
                    <button type="button" class="staff-icon-btn" onclick="doLogout()" title="Logout">
                        <i class="fas fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>

            <div class="staff-view-switch">
                <button type="button" class="staff-view-btn active" data-view="week" onclick="switchScheduleView('week')">
                    <i class="fas fa-calendar-week"></i> <span data-lang="ja">週</span><span data-lang="zh">周</span>
                </button>
                <button type="button" class="staff-view-btn" data-view="month" onclick="switchScheduleView('month')">
                    <i class="fas fa-calendar-days"></i> <span data-lang="ja">月</span><span data-lang="zh">月</span>
                </button>
            </div>

            <div class="staff-content">
                <div class="staff-period-nav">
                    <button type="button" class="staff-icon-btn" onclick="changeStaffPeriod(-1)">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <div class="period-label" id="periodLabel">-</div>
                    <button type="button" class="staff-icon-btn" onclick="changeStaffPeriod(1)">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Week view -->
                <div id="weekView"></div>

                <!-- Month view -->
                <div id="monthView" style="display:none;">
                    <div class="staff-month-dow-row" id="monthDowRow"></div>
                    <div class="staff-month-grid" id="monthGrid"></div>
                </div>

                <div class="staff-legend">
                    <div class="staff-legend-item"><span class="staff-legend-dot" style="background:var(--early-shift);"></span><span data-lang="ja">早番</span><span data-lang="zh">早班</span></div>
                    <div class="staff-legend-item"><span class="staff-legend-dot" style="background:var(--late-shift);"></span><span data-lang="ja">遅番</span><span data-lang="zh">晚班</span></div>
                    <div class="staff-legend-item"><span class="staff-legend-dot" style="background:var(--warning);"></span><span data-lang="ja">休み</span><span data-lang="zh">休息</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Đổi mật khẩu -->
    <div class="modal" id="changePasswordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-key"></i> <span data-lang="ja">パスワード変更</span><span data-lang="zh">修改密码</span></h3>
                <button type="button" class="modal-close" onclick="closeStaffModal('changePasswordModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="staff-login-error" id="pwError">
                    <i class="fas fa-circle-exclamation"></i><span id="pwErrorText"></span>
                </div>
                <div class="form-group">
                    <label data-lang="ja">現在のパスワード</label>
                    <label data-lang="zh">当前密码</label>
                    <div class="staff-input-wrap">
                        <input type="password" id="currentPassword" class="input-field" autocomplete="current-password">
                        <button type="button" class="staff-toggle-pass" onclick="togglePasswordVisibility('currentPassword', this)" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label data-lang="ja">新しいパスワード</label>
                    <label data-lang="zh">新密码</label>
                    <div class="staff-input-wrap">
                        <input type="password" id="newPassword" class="input-field" autocomplete="new-password">
                        <button type="button" class="staff-toggle-pass" onclick="togglePasswordVisibility('newPassword', this)" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label data-lang="ja">新しいパスワード(確認)</label>
                    <label data-lang="zh">确认新密码</label>
                    <div class="staff-input-wrap">
                        <input type="password" id="confirmNewPassword" class="input-field" autocomplete="new-password">
                        <button type="button" class="staff-toggle-pass" onclick="togglePasswordVisibility('confirmNewPassword', this)" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <p class="staff-pw-hint">
                    <span data-lang="ja">※ 6文字以上、自分の覚えやすいものでOKです。</span>
                    <span data-lang="zh">※ 6位以上，设置自己容易记住的密码即可。</span>
                </p>
                <button type="button" class="btn-primary" style="width:100%;" id="changePwBtn" onclick="doChangeMyPassword()">
                    <i class="fas fa-check"></i>
                    <span data-lang="ja">変更する</span><span data-lang="zh">确认修改</span>
                </button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>

    <script src="staff.js"></script>
</body>
</html>
